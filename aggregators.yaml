# Broad-coverage job aggregators (as opposed to companies.yaml, which is
# one board per company). These search across many employers at once using
# keyword + location, so they catch companies you haven't identified yet —
# at the cost of more noise, which is exactly what filters.py exists for.
#
# type: one of "adzuna" | "remotive" | "jooble"
# params: passed straight through to that aggregator's search API, EXCEPT
#   max_pages — a pipeline-level control consumed before building the
#   request, not sent to the aggregator itself.
#
# Customized for Uzi Cohen — QA Engineer, Israel-based.
#
# THIS is the real fix for "why is companies.yaml hardcoded" — an ATS API
# like Greenhouse has no "search every company" endpoint, so companies.yaml
# can only ever be a list of companies someone already knows about. Jooble
# below is a genuine job-search META-ENGINE: it indexes postings across
# thousands of local job boards, agencies, and company career pages per
# country/city, so it searches the WHOLE Israeli market by keyword+location
# with no company list needed at all — this is the dynamic search, not
# companies.yaml. companies.yaml also grows on its own now: every aggregator
# fetch here (Jooble included) feeds app/discover_companies.py, so any
# posting that resolves to a real Greenhouse/Lever/Ashby page gets appended
# to companies.yaml automatically after the run — you shouldn't need to
# hand-maintain that file going forward.
#
# Adzuna is dropped: it doesn't cover Israel as a country at all, and its
# client code (app/aggregator_clients.py) hardcodes a Canada-only endpoint
# on top of that. Remotive is dropped too: it's remote-only (misses
# Tel Aviv on-site/hybrid roles, which is most of the Israeli market) and
# thin — a real meta-search engine like Jooble is a better fit for "search
# the whole market" than another curated job board.

aggregators:
  - name: Jooble (QA Engineer, Israel)
    type: jooble
    params:
      keywords: "QA Engineer"
      location: "Israel"
      ResultOnPage: 20
      max_pages: 5

  - name: Jooble (QA Automation, Tel Aviv area)
    type: jooble
    params:
      keywords: "QA Automation"
      location: "Tel Aviv"
      ResultOnPage: 20
      max_pages: 5

  - name: Jooble (SDET / Test Automation Engineer, Israel)
    type: jooble
    params:
      keywords: "SDET OR \"Test Automation Engineer\""
      location: "Israel"
      ResultOnPage: 20
      max_pages: 5

  - name: Jooble (Quality Engineer, Israel)
    type: jooble
    params:
      keywords: "Quality Engineer"
      location: "Israel"
      ResultOnPage: 20
      max_pages: 3
