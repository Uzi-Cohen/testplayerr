# Company registry for the job discovery pipeline.
# ats: one of "greenhouse" | "ashby" | "workable" | "lever" | "smartrecruiters"
# slug: the identifier used in that ATS's public API URL
#
# Customized for Uzi Cohen — QA Engineer (mobile/SDK, iOS+Android, Java/
# Appium/Selenium/TestNG/REST Assured, security testing), Israel-based.
#
# ⚠️ IMPORTANT — VERIFY BEFORE TRUSTING: this session had no live outbound
# network access (sandboxed dev environment, same limitation the original
# author documented in app/ats_clients.py), so none of the slugs below
# were hit against a real API the way the upstream template's Canadian
# companies were. They're a best-effort list of companies that likely run
# on one of the 5 supported ATSes, from general knowledge, not a verified
# registry. Before a real run, sanity-check each one:
#
#   python -m app.main --company <slug>
#
# Delete/fix any that 404 or come back empty when you expect postings, and
# add the ones you actually find while applying. Also see the README's
# note on Comeet: a large share of Israeli tech companies (much of the
# Tel Aviv startup scene) run their careers page on Comeet, which isn't
# one of the 5 ATSes this pipeline supports — those companies won't show
# up here no matter how you spell the slug. companies.yaml direct-fetch is
# strongest for multinationals with an Israel R&D center on Greenhouse/
# Lever/Ashby; lean on aggregators.yaml + manual LinkedIn/company-site
# search to cover the rest.

companies:
  # Mobile / ad-tech / SDK — closest match to Digital Turbine background
