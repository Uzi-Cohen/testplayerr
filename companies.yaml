# Company registry for the job discovery pipeline.
# ats: one of "greenhouse" | "ashby" | "workable" | "lever" | "smartrecruiters" | "comeet"
# slug: the identifier used in that ATS's public API URL — EXCEPT for
#   comeet, where it's the full board path from the company's public URL
#   (e.g. "monday/41.00B" for comeet.com/jobs/monday/41.00B), not a bare
#   company name. See app/ats_clients.py's fetch_comeet docstring for why.
#
# Customized for Uzi Cohen — QA Engineer (mobile/SDK, iOS+Android, Java/
# Appium/Selenium/TestNG/REST Assured, security testing), Israel-based.
#
# ⚠️ IMPORTANT — VERIFY BEFORE TRUSTING, TWO CONFIDENCE TIERS BELOW:
# this session had no live outbound network access at all (sandboxed dev
# environment, same limitation the original template's author documented
# in app/ats_clients.py), so NOTHING here was hit against a real API the
# way the upstream template's Canadian companies were. Before a real run,
# sanity-check every entry:
#
#   python -m app.main --company <slug>
#
#   1. The "greenhouse"/"ashby" entries below are a best-effort guess from
#      general knowledge of which companies likely run on one of those
#      ATSes — not independently confirmed at all.
#   2. The "comeet" entries ARE backed by a real indexed URL found via web
#      search during this session (i.e. an actual page Google/Bing has
#      crawled, not a guess) — higher confidence than tier 1, but still
#      unverified against a live API response, and Comeet boards churn
#      (a company can close all reqs, so 0 results back doesn't
#      necessarily mean the slug is wrong).
#
# Delete/fix any that 404 or come back empty when you expect postings, and
# add the ones you actually find while applying. Comeet powers a large
# share of the Israeli tech scene that Greenhouse/Lever/Ashby/
# SmartRecruiters miss entirely — the comeet: section below is a starting
# point, not a complete list; find more by opening a company's real
# careers page and copying the board path out of the URL.

